            self.__VM = self.__VM || [];

                window.AdTop = y.Config.buildPlacement((z) => {
                    z.add("billboard");
                    z.addDefaultOrUnique("mobile_banner").setBreakPoint("mobile");
                }, "top").display("ad-atf");
            });
